name: Fetch JazzHR Jobs

# Pulls open roles from JazzHR into jobs.json, commits it if anything changed,
# and then deploys — that last part matters more than it looks.
#
# THE LINK THAT WAS MISSING. This workflow commits with GITHUB_TOKEN, and
# GitHub deliberately does not let a GITHUB_TOKEN push trigger other
# workflows: it is how they stop a workflow that commits from re-triggering
# itself forever. The side effect is that deploy.yml never fired on the
# bot's commits, so a fresh jobs.json would land on GitHub and stop there.
# The openings page would go on serving filled roles, looking perfectly
# healthy, which is exactly the failure this automation exists to prevent.
#
# Fixed by calling deploy.yml directly as a reusable workflow rather than
# hoping a push event does it. The call only happens when jobs.json actually
# changed, so a quiet hour costs nothing.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# Two runs overlapping would race on the same commit. Queue instead, and
# never cancel one mid-push.
concurrency:
  group: fetch-jazzhr-jobs
  cancel-in-progress: false

# No workflow-level permissions block: each job asks for exactly what it
# needs, and nothing inherits write by default.
permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # only this job commits
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # Pinned to full commit SHAs, not tags. A tag can be moved; that is
      # precisely how the tj-actions/changed-files compromise reached 23,000
      # repositories in March 2025. The trailing comment is what Dependabot
      # reads to keep the pin current.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.x"

      - name: Fetch open jobs from JazzHR
        env:
          JAZZHR_API_KEY: ${{ secrets.JAZZHR_API_KEY }}
        run: python3 scripts/fetch_jobs.py

      - name: Commit jobs.json if it changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if git diff --staged --quiet; then
            echo "No job changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update job listings from JazzHR"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Deploy the new jobs.json. Called directly rather than relying on the push
  # above to trigger deploy.yml, which it cannot — see the note at the top.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

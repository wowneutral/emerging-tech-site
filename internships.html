<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Internships — Emerging Tech</title>
<!--
  REDIRECT STUB, NOT A PAGE.

  The internships page was folded into Careers. On Hostinger the .htaccess
  301 fires before this file is ever served, which is the correct, cacheable,
  SEO-preserving redirect. This exists for hosts that cannot do a server-side
  redirect at all — GitHub Pages being the one we actually use, where
  /internships currently returns a hard 404.

  A meta refresh is a weaker redirect than a 301: slower, and search engines
  treat it as a hint rather than an instruction. The canonical tag is what
  actually consolidates the ranking onto /careers, so it matters more than the
  refresh does. Both are here because this file has to work on a host that
  gives us no other tools.

  noindex keeps the stub itself out of results.
-->
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=careers#internships">
<link rel="canonical" href="https://emergingtech.co/careers.html">
<script>window.location.replace('careers#internships');</script>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#F7F5F1;color:#0B1F3A;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center}
  a{color:#0B1F3A}
</style>
</head>
<body>
  <p>Our internship programme now lives on the
     <a href="careers#internships">Careers page</a>. Redirecting you there now.</p>
</body>
</html>
